# Tests, then builds and publishes the plugin zip when a vX.Y.Z tag is pushed.
# Managed from carmelosantana/kanboard-plugin-ci (templates/workflows/); update it with
# scripts/sync-workflows.sh there rather than by hand.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: carmelosantana/kanboard-plugin-ci/.github/workflows/plugin-test.yml@1d719a2084fc2ab6e77cbc99377b2f318f60a638 # harness 2026-11-25
  release:
    needs: test
    permissions:
      contents: write
    uses: carmelosantana/kanboard-plugin-ci/.github/workflows/plugin-release.yml@1d719a2084fc2ab6e77cbc99377b2f318f60a638 # harness 2026-11-25
    with:
      ship-docs: false
